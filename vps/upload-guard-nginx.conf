# One worker is sufficient for the deliberately small upload concurrency.
worker_processes 1;
pid /run/nginx.pid;
# Token-bearing upstream errors must never reach Docker logs.
error_log /dev/null;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile off;
    keepalive_timeout 30s;
    include /etc/nginx/conf.d/*.conf;
}
