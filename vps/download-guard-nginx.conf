# One worker is sufficient for six streams and avoids `worker_processes auto`,
# which sees every host CPU despite the container quota.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile off;
    keepalive_timeout 30s;
    include /etc/nginx/conf.d/*.conf;
}
