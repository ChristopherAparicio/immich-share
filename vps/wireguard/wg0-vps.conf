# VPS — /etc/wireguard/wg0.conf (chmod 600)
# Generate keys with: wg genkey | tee private.key | wg pubkey > public.key
[Interface]
Address = <WG_VPS_ADDRESS>/<WG_PREFIX_LENGTH>
ListenPort = <WG_LISTEN_PORT>
PrivateKey = <VPS_PRIVATE_KEY>
# The VPS never relays between the NAS and admin peers: a host that had
# net.ipv4.ip_forward=1 before Docker started keeps FORWARD at ACCEPT, so the
# wg0 -> wg0 drop is stated explicitly. This is the only firewall rule that
# belongs to the tunnel. The Docker bridge containment (`immich-tunnel` and
# `immich-uptun` may forward only to the NAS filter ports) lives in DOCKER-USER
# and is owned by the immich-share-containment systemd unit from
# vps/containment/, not by this file: rules installed from PostUp/PostDown
# would vanish on `systemctl restart wg-quick@wg0` and leave IPP and
# upload-guard with open egress until the tunnel came back.
PostUp = iptables -I FORWARD 1 -i wg0 -o wg0 -j DROP
PostDown = iptables -D FORWARD -i wg0 -o wg0 -j DROP

# WireGuard is symmetric: these AllowedIPs also let the VPS initiate traffic to
# both addresses. Home-side nginx and pf rules enforce containment.

[Peer]
# NAS — data through filtering nginx to Immich.
PublicKey = <NAS_PUBLIC_KEY>
AllowedIPs = <WG_NAS_ADDRESS>/32

[Peer]
# Mac mini — SSH/Caddy administration, protected by pf on the Mac mini.
PublicKey = <MACMINI_PUBLIC_KEY>
AllowedIPs = <WG_CONTROLLER_ADDRESS>/32
