# immich-share VPS disk hygiene: cap the systemd journal.
# Install: /etc/systemd/journald.conf.d/50-immich-share-journald.conf
# The journal otherwise grows to ~1 GB on a 20 GB VPS and eats into the IPP
# ZIP disk reserve. Share telemetry reads Caddy's access log, not the journal.
[Journal]
SystemMaxUse=200M
