# VPS edge — Caddy with rate limiting and immich-public-proxy.
# Target directory: /srv/photo-share/. See SETUP.md.
services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    init: true
    restart: unless-stopped
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-photos.example.com}
    ports:
      - "80:80"     # HTTP-01 + redirection → 443
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./shares.d:/etc/caddy/shares.d:ro   # Written by immich-share over SSH.
      - ./drops.d:/etc/caddy/drops.d:ro     # Empty means upload is public 404.
      - ./caddy-data:/data
      - ./caddy-config:/config
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    cpus: ${CADDY_CPU_LIMIT:-0.50}
    pids_limit: ${CADDY_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - public_net
      - app_net
      # Reserved for the optional upload edge. Caddy is the only base service on
      # `upload_net`, so a read-only deployment merely carries an empty private
      # bridge; `docker-compose.upload.yml` attaches `upload-guard` to it.
      - upload_net

  ipp:
    # Separate AGPL fork. Release deployments append the verified immutable
    # multi-architecture digest to this exact version tag.
    image: ghcr.io/christopheraparicio/immich-public-proxy:3.2.1-immich-share.6@sha256:f2bc9adf59c1dd79c62ee618f4fe0170ef1be04f74174649b6d1631811e5d73a
    container_name: ipp
    init: true
    restart: unless-stopped
    environment:
      # NAS-side filtering nginx over WireGuard, never Immich directly.
      - IMMICH_URL=http://${NAS_WG_ADDRESS:?set NAS_WG_ADDRESS in .env}:2283
      - PUBLIC_BASE_URL=https://${PUBLIC_DOMAIN:-photos.example.com}
      - TMPDIR=/zip-staging
      - IPP_ZIP_DISK_BUDGET_PERCENT=${ZIP_DISK_BUDGET_PERCENT:-50}
      - IPP_ZIP_SPLIT_THRESHOLD_BYTES=${ZIP_SPLIT_THRESHOLD_BYTES:-1073741824}
      - IPP_ZIP_PART_TARGET_BYTES=${ZIP_PART_TARGET_BYTES:-536870912}
      - IPP_ZIP_PLAN_CONCURRENCY=${ZIP_PLAN_CONCURRENCY:-12}
      - IPP_ZIP_MAX_PARALLEL_DOWNLOADS=${ZIP_MAX_PARALLEL_DOWNLOADS:-3}
    volumes:
      - ./ipp-config.json:/app/config.json:ro
      - ./zip-staging:/zip-staging
    # Container hardening.
    read_only: true
    tmpfs:
      - /tmp:size=${IPP_TMPFS_SIZE:-256m},mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    mem_limit: ${IPP_MEMORY_LIMIT:-512m}
    cpus: ${IPP_CPU_LIMIT:-1.00}
    pids_limit: ${IPP_PIDS_LIMIT:-256}
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_net
      - tunnel_net

  # Receives only download routes from Caddy. Gallery HTML, thumbnails, preview
  # zoom, and metadata continue directly from Caddy to IPP.
  download-guard:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: immich-share-nginx:1.31.4-hardened
    container_name: download-guard
    init: true
    restart: unless-stopped
    user: "101:101"
    depends_on:
      - ipp
    environment:
      NGINX_ENVSUBST_FILTER: "^(DOWNLOAD_|ZIP_|IPP_UPSTREAM$)"
      IPP_UPSTREAM: ipp:3000
      DOWNLOAD_RATE: ${DOWNLOAD_RATE:-2m}
      DOWNLOAD_RATE_AFTER: ${DOWNLOAD_RATE_AFTER:-1m}
      DOWNLOAD_PER_IP: ${DOWNLOAD_PER_IP:-2}
      DOWNLOAD_GLOBAL: ${DOWNLOAD_GLOBAL:-6}
      DOWNLOAD_LIMIT_DRY_RUN: ${DOWNLOAD_LIMIT_DRY_RUN:-off}
      ZIP_RATE: ${ZIP_RATE:-2m}
      ZIP_RATE_AFTER: ${ZIP_RATE_AFTER:-1m}
      ZIP_GLOBAL: ${ZIP_GLOBAL:-3}
    volumes:
      - ./download-guard-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./download-guard.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./zip-busy.html:/usr/share/nginx/html/zip-busy.html:ro
      - ./zip-too-large.html:/usr/share/nginx/html/zip-too-large.html:ro
      - ./zip-unavailable.html:/usr/share/nginx/html/zip-unavailable.html:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755,uid=101,gid=101,noexec,nosuid,nodev
      - /var/cache/nginx:size=4m,mode=0755,uid=101,gid=101,noexec,nosuid,nodev
      - /var/run:size=1m,mode=0755,uid=101,gid=101,noexec,nosuid,nodev
      - /tmp:size=1m,mode=1777,uid=101,gid=101,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${DOWNLOAD_GUARD_MEMORY_LIMIT:-64m}
    cpus: ${DOWNLOAD_GUARD_CPU_LIMIT:-0.25}
    pids_limit: ${DOWNLOAD_GUARD_PIDS_LIMIT:-32}
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_net

networks:
  public_net:
  # Gallery data plane: Caddy, IPP and the download guard. Internal only.
  app_net:
    internal: true
  # Write-side boundary. Only Caddy and the optional `upload-guard` join it, so
  # a compromised IPP or download-guard container has no route to the
  # upload-guard listener or to the NAS upload filter behind it. Must be
  # declared identically in docker-compose.upload.yml (same project, same
  # network name).
  upload_net:
    internal: true
  # NAT bridge from IPP to the host's wg0. The bridge interface name is pinned
  # so the DOCKER-USER allowlist in vps/containment/immich-share-containment.sh
  # can reference the interface instead of a subnet (the upload edge uses its
  # own bridge, `immich-uptun`, in docker-compose.upload.yml). Keep the name in
  # sync with the containment script and the CLI doctor probe.
  tunnel_net:
    driver_opts:
      com.docker.network.bridge.name: immich-tunnel
