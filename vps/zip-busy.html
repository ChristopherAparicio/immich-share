<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Download busy</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; }
    main { width: min(34rem, calc(100% - 3rem)); text-align: center; }
    h1 { font-size: 1.5rem; }
    p { color: #d1d5db; line-height: 1.55; }
    button { margin-top: 1rem; padding: .8rem 1.1rem; border: 0; border-radius: .6rem; font: inherit; font-weight: 650; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Another album download is already in progress</h1>
    <p>Try again in <strong id="seconds">30</strong> seconds. This limit protects the server without affecting the gallery.</p>
    <button type="button" onclick="history.back()">Back to the album</button>
  </main>
  <script>
    let remaining = 30
    const output = document.getElementById('seconds')
    setInterval(() => { if (remaining > 0) output.textContent = String(--remaining) }, 1000)
  </script>
</body>
</html>
