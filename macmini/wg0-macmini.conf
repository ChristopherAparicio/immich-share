# Mac mini — administrator peer (macOS WireGuard app or Homebrew wireguard-tools)
[Interface]
Address = <WG_CONTROLLER_ADDRESS>/<WG_PREFIX_LENGTH>
PrivateKey = <MACMINI_PRIVATE_KEY>

[Peer]
PublicKey = <VPS_PUBLIC_KEY>
Endpoint = <VPS_PUBLIC_IP>:<WG_LISTEN_PORT>
# Route only the VPS address through this tunnel.
AllowedIPs = <WG_VPS_ADDRESS>/32
PersistentKeepalive = 25

# After activation, apply the packet-filter rule from pf-wireguard.md. Without
# it, the VPS can initiate traffic toward this Mac mini.
