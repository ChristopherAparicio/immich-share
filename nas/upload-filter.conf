# Fail-closed upload filter. The public application contract is intentionally
# small. Any route or method not listed here returns 404 before reaching the
# upload service.

map "$request_method:$uri" $drop_action {
    default denied;

    "~^GET:/drop/i/[A-Za-z0-9_-]{32,128}/?$" invite_ui;
    "~^GET:/drop/assets/(?:app\.js|drop\.css|favicon\.png)$" asset;
    "~^POST:/drop/api/invites/[A-Za-z0-9_-]{32,128}/unlock/?$" unlock;
    "~^GET:/drop/api/invites/[A-Za-z0-9_-]{32,128}/policy/?$" policy;
    "~^POST:/drop/api/invites/[A-Za-z0-9_-]{32,128}/uploads/?$" create_upload;
    "~^HEAD:/drop/api/uploads/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" upload_status;
    "~^PATCH:/drop/api/uploads/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" upload_chunk;
    "~^DELETE:/drop/api/uploads/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" upload_cancel;
}

map $drop_action $drop_route_allowed {
    default 1;
    denied 0;
}

map $drop_route_allowed $log_allowed {
    default 0;
    1 1;
}

map $drop_route_allowed $log_denied {
    default 1;
    1 0;
}

map $http_x_client_ip $drop_client_key {
    "" $remote_addr;
    default $http_x_client_ip;
}

# Never log $uri, $request_uri, $request, cookies, original filenames, or
# invitation tokens. Only a normalized action is retained.
log_format drop_route '$remote_addr [$time_iso8601] action=$drop_action '
                      'status=$status bytes=$body_bytes_sent';

limit_req_zone $drop_client_key zone=drop_rate:1m rate=${UPLOAD_FILTER_REQUEST_RATE};
limit_conn_zone $drop_client_key zone=drop_per_ip:1m;
limit_conn_zone $server_name zone=drop_global:1m;

server {
    listen ${UPLOAD_NAS_WG_ADDRESS}:2383;
    # Private probe endpoint inside the shared network namespace. This lets the
    # security doctor exercise the effective route gate while OUTPUT remains
    # fail-closed; it is unreachable from the tunnel and Docker networks.
    listen 127.0.0.1:2383;
    server_name upload-filter;
    server_tokens off;

    # nginx error entries may echo the token-bearing request target.
    error_log /dev/null;
    access_log /var/log/nginx/allowed.log drop_route if=$log_allowed;
    access_log /var/log/nginx/denied.log drop_route if=$log_denied;

    client_max_body_size 4k;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 60s;

    location = /__drop_route_gate {
        internal;
        # The auth subrequest sees the main request body. Keep its ceiling at
        # the PATCH maximum; each public location still applies its own lower
        # 4 KiB metadata ceiling before this gate runs.
        client_max_body_size ${UPLOAD_FILTER_MAX_BODY};
        if ($main_drop_route_allowed = 0) {
            return 403;
        }
        return 204;
    }

    location @drop_not_found {
        return 404;
    }

    location ~ "^/drop/api/uploads/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" {
        client_max_body_size ${UPLOAD_FILTER_MAX_BODY};
        set $main_drop_route_allowed $drop_route_allowed;

        limit_req zone=drop_rate burst=60 nodelay;
        limit_req_status 429;
        limit_conn drop_per_ip ${UPLOAD_FILTER_PER_IP};
        limit_conn drop_global ${UPLOAD_FILTER_GLOBAL};
        limit_conn_status 429;
        auth_request /__drop_route_gate;
        error_page 403 =404 @drop_not_found;

        proxy_pass http://${DROP_UPSTREAM};
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 2m;
        proxy_read_timeout 2m;

        proxy_set_header Host upload-drop;
        proxy_set_header X-Client-IP $http_x_client_ip;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        client_max_body_size 4k;
        set $main_drop_route_allowed $drop_route_allowed;

        limit_req zone=drop_rate burst=60 nodelay;
        limit_req_status 429;
        limit_conn drop_per_ip ${UPLOAD_FILTER_PER_IP};
        limit_conn drop_global ${UPLOAD_FILTER_GLOBAL};
        limit_conn_status 429;
        auth_request /__drop_route_gate;
        error_page 403 =404 @drop_not_found;

        proxy_pass http://${DROP_UPSTREAM};
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 2m;
        proxy_read_timeout 2m;

        proxy_set_header Host upload-drop;
        proxy_set_header X-Client-IP $http_x_client_ip;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
