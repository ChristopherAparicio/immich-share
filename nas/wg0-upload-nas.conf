# NAS upload-drop peer — mounted at /config/wg0.conf (mode 0600 in deployment).
# This key and address must differ from the read-only Immich sharing peer.
[Interface]
Address = <UPLOAD_NAS_WG_ADDRESS>/<WG_PREFIX_LENGTH>
PrivateKey = <UPLOAD_NAS_PRIVATE_KEY>
# Do not add forwarding rules. Verify net.ipv4.ip_forward=0 in the container.

[Peer]
PublicKey = <VPS_PUBLIC_KEY>
Endpoint = <VPS_PUBLIC_IP>:<WG_LISTEN_PORT>
AllowedIPs = <WG_VPS_ADDRESS>/32
PersistentKeepalive = 25
