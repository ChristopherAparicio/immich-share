# NAS-controller profile. Copy to ~/.config/immich-share/config.ini and chmod 600.

[immich]
# Use the NAS-local published address. Do not use the public sharing domain.
url = http://127.0.0.1:2283
api_key_file = ~/.config/immich-share/api-key
public_base_url = https://photos.example.com

[sharing]
default_ttl = 24h
default_allow_download = true
max_ttl = 30d
managed_state_file = ~/.config/immich-share/managed-shares.json

[vps]
# Define this alias using ssh-config.example. It reaches SSH through wg-tunnel.
ssh = vps-photos-via-wg
deployment_dir = /srv/photo-share
shares_dir = /srv/photo-share/shares.d
caddy_validate_cmd = cd /srv/photo-share && docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
caddy_reload_cmd   = cd /srv/photo-share && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
ipp_upstream = ipp:3000
download_guard_upstream = download-guard:8080

[nas]
# Local Docker commands: no SSH back into the NAS and no Docker socket mount.
forward_on_cmd  = docker start wg-nginx-filter
forward_off_cmd = docker stop wg-nginx-filter

[controller]
mode = nas
# One peer is enough when controller SSH and photo data share wg-tunnel. Set 2
# when a separate administrator WireGuard peer remains enabled.
expected_wireguard_peers = 1
wireguard_container = wg-tunnel
filter_container = wg-nginx-filter
logrotate_container = immich-share-logrotate
immich_container = immich_server
immich_share_network = immich_share
vps_wireguard_address = <WG_VPS_ADDRESS>

[monitor]
bind = 127.0.0.1
username = immich-share
password_file = ~/.config/immich-share/monitor-password
telemetry_retention_days = 90
