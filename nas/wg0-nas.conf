# NAS — WireGuard container configuration mounted at /config/wg0.conf.
[Interface]
Address = <WG_NAS_ADDRESS>/<WG_PREFIX_LENGTH>
PrivateKey = <NAS_PRIVATE_KEY>
# Do NOT add forwarding iptables rules: the tunnel must not route into the LAN.
# Verify net.ipv4.ip_forward=0 inside the container.

[Peer]
PublicKey = <VPS_PUBLIC_KEY>
Endpoint = <VPS_PUBLIC_IP>:<WG_LISTEN_PORT>
AllowedIPs = <WG_VPS_ADDRESS>/32
# The home side initiates the tunnel, crossing NAT without port forwarding.
PersistentKeepalive = 25
