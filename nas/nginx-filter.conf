# Filtering nginx — trust boundary between the VPS and Immich.
# Method and URI combinations are explicitly allowed. Any new IPP route fails
# with 404 and appears in denied.log before it can reach Immich. Every pattern
# ends in \z, not $: nginx decodes %0A into $uri and PCRE's $ also matches
# before a trailing newline.

map "$request_method:$uri" $ipp_route_allowed {
    default 0;

    ~^GET:/api/server/(version|ping)\z 1;
    ~^GET:/api/shared-links/me\z 1;
    ~^POST:/api/shared-links/login\z 1;
    ~^GET:/api/timeline/buckets?\z 1;

    # Detail, thumbnail, original, or video playback for a UUID asset.
    "~^GET:/api/assets/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/(?:thumbnail|original|video/playback))?\z" 1;
}

map $ipp_route_allowed $log_allowed {
    default 0;
    1 1;
}

map $ipp_route_allowed $log_denied {
    default 1;
    1 0;
}

# IPP unlocks a password-protected link with POST /api/shared-links/login and
# presents the resulting immich_shared_link_token cookie afterwards. That cookie
# is the only credential this boundary forwards. The allowlisted routes also
# serve fully authenticated Immich users, so an Immich session cookie, API key
# or bearer token that ever crosses the VPS must be dropped here, not by Immich.
map $http_cookie $immich_share_cookie {
    default "";
    "~(?:^|;\s*)immich_shared_link_token=([^;\s]+)" "immich_shared_link_token=$1";
}

# Never log $request or $request_uri here: IPP authenticates asset requests with
# a `?key=<share-key>` query parameter. Only the normalized path is retained.
log_format ipp_route '$remote_addr [$time_iso8601] "$request_method $uri" '
                     'status=$status bytes=$body_bytes_sent';

# IPP always arrives from the same VPS peer. These limits protect Immich
# globally; public per-client quotas remain at the edge.
limit_req_zone $binary_remote_addr zone=share_rate:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=share_conn:1m;

server {
    listen ${NAS_WG_ADDRESS}:2283;
    # Private probe endpoint inside the shared network namespace. This lets the
    # security doctor exercise the effective route gate while OUTPUT remains
    # fail-closed (only -o lo -d 127.0.0.1/32 is allowed after bootstrap); it
    # is unreachable from the tunnel and Docker networks. The doctor's
    # forbidden-route probe therefore lands in denied.log with $remote_addr
    # 127.0.0.1; the Mac mini tripwire skips exactly those lines. Only the
    # doctor, or a process already inside this namespace, can produce them:
    # WireGuard cryptokey routing and the kernel both reject 127/8 sources on
    # non-loopback interfaces.
    listen 127.0.0.1:2283;
    server_tokens off;

    # nginx error entries can embed the raw request (including ?key=...).
    # Route failures are observable through the sanitized access logs instead.
    error_log /dev/null;
    access_log /var/log/nginx/allowed.log ipp_route if=$log_allowed;
    access_log /var/log/nginx/denied.log ipp_route if=$log_denied;

    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10m;

    location = /__ipp_route_gate {
        internal;
        if ($main_ipp_route_allowed = 0) {
            return 403;
        }
        return 204;
    }

    location @ipp_not_found {
        return 404;
    }

    location / {
        # Capture the main request decision here. The internal subrequest then
        # inherits it without re-evaluating the map for /__ipp_route_gate.
        set $main_ipp_route_allowed $ipp_route_allowed;

        # Applied before the route authorization subrequest, including probes
        # that will ultimately receive 404 and be written to denied.log.
        limit_req zone=share_rate burst=60 nodelay;
        limit_req_status 429;
        limit_conn share_conn 32;
        limit_conn_status 429;
        auth_request /__ipp_route_gate;
        error_page 403 =404 @ipp_not_found;

        # The WireGuard container resolves Immich once during bootstrap and
        # exposes only its allowlisted local relay in this shared namespace.
        # The gate decided on the normalized $uri; forward exactly that path,
        # never the raw request target (//, ., .., %-encoded variants).
        proxy_pass http://${IMMICH_UPSTREAM}$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 10m;

        # Do not present the VPS address to Immich as the public client address.
        proxy_set_header Host immich_server;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Connection "";

        # Share-key semantics only: forward the shared-link token cookie and
        # strip every other credential carrier (see $immich_share_cookie).
        proxy_set_header Cookie $immich_share_cookie;
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header x-api-key "";
        proxy_set_header x-immich-user-token "";
        proxy_set_header x-immich-session-token "";
    }
}
