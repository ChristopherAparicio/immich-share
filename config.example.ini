# immich-share — copy to ~/.config/immich-share/config.ini (chmod 600)

[immich]
# Authenticated HTTPS URL for Immich on the NAS, never the public sharing URL.
# HTTP is accepted only on loopback. If this address is carried inside a direct
# WireGuard/Tailscale/SSH tunnel, explicitly set the confirmation below.
url = https://immich.internal.example
allow_http_over_private_tunnel = false
# DEDICATED, SCOPED Immich API key (shared links and album read), never an
# administrator key. Protect this file with chmod 600.
api_key_file = ~/.config/immich-share/api-key
public_base_url = https://photos.example.com

[sharing]
# Defaults used by `immich-share open` unless a CLI option overrides them.
# `--download` and `--no-download` select the policy for one share.
default_ttl = 24h
default_allow_download = true
max_ttl = 30d
# Ownership registry. sync/close/sweep never touch an Immich link absent here.
managed_state_file = ~/.config/immich-share/managed-shares.json
# Gallery and download quality are global IPP settings. See
# vps/ipp-config.json (maxZoomQuality and maxDownloadQuality).

[vps]
# SSH over the administrator WireGuard tunnel. Keep real tunnel addresses only
# in the operator's private config, never in this repository.
# Use a dedicated key and define Host vps-photos in ~/.ssh/config with
#   IdentityFile ~/.ssh/vps-photos + ForwardAgent no (the CLI also forces -o ForwardAgent=no)
ssh = <VPS_SSH_ALIAS>
deployment_dir = /srv/photo-share
shares_dir = /srv/photo-share/shares.d
caddy_validate_cmd = cd /srv/photo-share && docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
caddy_reload_cmd   = cd /srv/photo-share && docker compose exec -T caddy caddy reload   --config /etc/caddy/Caddyfile
# IPP upstream as seen by Caddy (Compose service name and port).
ipp_upstream = ipp:3000
# Individual `.../original` downloads and ZIP responses pass through this guard.
download_guard_upstream = download-guard:8080

[nas]
# Dedicated forced-command SSH key; the remote account must not expose a shell
# or unrestricted Docker access. See nas/forward-command.sh and
# nas/ssh-forward-gate.example.
forward_on_cmd  = ssh nas-photo-gate "forward on"
forward_off_cmd = ssh nas-photo-gate "forward off"
# Read-only forced command. It reveals only a pass/fail summary.
doctor_cmd      = ssh nas-photo-gate "doctor"

[controller]
# `separate` is the recommended three-role topology. Use `nas` only when this
# CLI runs directly on the NAS and the VPS SSH alias traverses the NAS tunnel.
mode = separate
# Number of WireGuard peers expected to have a handshake within five minutes.
expected_wireguard_peers = 2
# Used by `doctor --mode nas`; these defaults match nas/docker-compose.yml.
wireguard_container = wg-tunnel
filter_container = wg-nginx-filter
logrotate_container = immich-share-logrotate
immich_container = immich_server
immich_share_network = immich_share
vps_wireguard_address = <WG_VPS_ADDRESS>
# Required in separate mode so doctor can prove that the VPS cannot initiate
# traffic toward the controller. Keep the real address only in private config.
controller_wireguard_address = <WG_CONTROLLER_ADDRESS>
pf_anchor = wg-inbound

[monitor]
# The monitor can create or close shares. The safe default is loopback. To open
# it from another device, use an encrypted tailnet address, never 0.0.0.0 or an
# unencrypted LAN address, and configure the credentials below.
bind = 127.0.0.1
# If the console is accessed through a tailnet/MagicDNS hostname instead of an
# address, list allowed names here, separated by commas, to prevent DNS rebinding.
# allowed_hosts = my-admin.tailnet.ts.net
# Required even on loopback. Store a random password in this mode-0600 file.
# HTTP Basic authentication is safe remotely only inside the encrypted tailnet.
username = immich-share
password_file = ~/.config/immich-share/monitor-password
# Explicit acknowledgement required for any non-loopback bind.
# allow_http_over_private_tunnel = true
telemetry_retention_days = 90
